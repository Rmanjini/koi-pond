name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --release --locked
