[package]
name = "git-koi"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
description = "A pixel-art koi pond for a GitHub profile: one koi per repository, sized by its commits."
repository = "https://github.com/Rmanjini/koi-pond"
readme = "README.md"
license = "MIT"
keywords = ["github", "profile", "koi", "pixel-art", "gif"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github", "/pond.gif"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
